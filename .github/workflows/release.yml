name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-macos:
    name: Release macOS (${{ matrix.arch_label }})
    runs-on: macos-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_label: Apple Silicon
            rust_target: aarch64-apple-darwin
            dmg_arch: aarch64
          - arch_label: Intel
            rust_target: x86_64-apple-darwin
            dmg_arch: x86_64

    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate release version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAURI_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          CARGO_VERSION="$(node -e "const fs=require('fs'); const match=fs.readFileSync('src-tauri/Cargo.toml','utf8').match(/^version = \"(.+)\"$/m); if (!match) process.exit(1); process.stdout.write(match[1]);")"

          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ] || [ "$TAG_VERSION" != "$TAURI_VERSION" ] || [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag version:    $TAG_VERSION"
            echo "package.json:   $PACKAGE_VERSION"
            echo "tauri.conf.json:$TAURI_VERSION"
            echo "Cargo.toml:     $CARGO_VERSION"
            echo "Version mismatch detected."
            exit 1
          fi

      - name: Build app
        run: npm run tauri build -- --target ${{ matrix.rust_target }}
        env:
          APPLE_SIGNING_IDENTITY: "-"

      - name: Ad-hoc codesign
        run: |
          APP_PATH="src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/Codexs.app"
          codesign --force --deep --sign - "$APP_PATH"

      - name: Create DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP_PATH="src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/Codexs.app"
          DMG_NAME="Codexs_${VERSION}_${{ matrix.dmg_arch }}.dmg"
          hdiutil create -volname "Codexs" -srcfolder "$APP_PATH" -ov -format UDZO "$DMG_NAME"
          echo "DMG_PATH=$DMG_NAME" >> "$GITHUB_ENV"

      - name: Upload to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" "${{ env.DMG_PATH }}" --clobber
